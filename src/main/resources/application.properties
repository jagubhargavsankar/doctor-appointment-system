```properties
spring.application.name=doctor-appointment-system
server.port=8080

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doctor_appointment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Initial admin account
app.admin.email=${ADMIN_EMAIL:admin@demo.com}
app.admin.password=${ADMIN_PASSWORD}

# Groq AI
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# Local embeddings
spring.ai.model.embedding=transformers

# Logging
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.ai.chat.client=INFO
logging.level.org.springframework.ai.tool=INFO
logging.level.com.bhargava.doctorappointment.tools.AppointmentTools=INFO

# Optional Ollama configuration
# spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.options.model=llama3.1:8b
# spring.ai.ollama.embedding.options.model=nomic-embed-text
```